name: Registration tracking verification
on:
  push:
    branches: [main]
    paths: ['index.html', 'registration*', 'growth-tracker.js', 'tracking-config.js', 'integrations/**', 'tests/**', 'tools/**', '.github/workflows/tracking-test.yml']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python tools/check-registration-browser.py
